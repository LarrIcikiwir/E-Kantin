<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Kantin — Kelompok 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header / Navigation -->
  <header class="navbar">
    <div class="nav-container">
      <div class="brand">
        <span class="brand-badge">🍱</span>
        <div>
          <h1>E-Kantin</h1>
          <p class="tagline">Kantin Digital — Kelompok 3</p>
        </div>
      </div>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Cari makanan atau minuman..." />
      </div>

      <button id="cartToggleBtn" class="cart-trigger" aria-label="Buka Keranjang">
        <span>🛒 Keranjang</span>
        <span id="cartCountBadge" class="badge">0</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container layout">
    <section class="menu-section">
      <!-- Category Filter Pills -->
      <nav class="categories" id="categoryList">
        <button class="chip active" data-cat="all">Semua</button>
        <button class="chip" data-cat="makanan">🍛 Makanan</button>
        <button class="chip" data-cat="minuman">🧋 Minuman</button>
        <button class="chip" data-cat="snack">🍟 Cemilan</button>
      </nav>

      <!-- Products Grid -->
      <div id="productGrid" class="product-grid"></div>
    </section>

    <!-- Cart Drawer / Sidebar -->
    <aside id="cartDrawer" class="cart-panel">
      <div class="cart-header">
        <h2>Pesanan Saya</h2>
        <button id="closeCartBtn" class="btn-ghost" aria-label="Tutup Keranjang">&times;</button>
      </div>

      <div id="cartItems" class="cart-items">
        <p class="empty-state">Keranjang masih kosong.</p>
      </div>

      <div class="cart-summary">
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotalPrice">Rp 0</span>
        </div>
        <div class="summary-row">
          <span>Biaya Layanan</span>
          <span>Gratis</span>
        </div>
        <div class="summary-row total">
          <span>Total Bayar</span>
          <span id="totalPrice">Rp 0</span>
        </div>
        <button id="checkoutBtn" class="btn-primary" disabled>Lanjut Pembayaran</button>
      </div>
    </aside>
  </main>

  <!-- Checkout / QRIS Modal -->
  <dialog id="checkoutModal" class="modal">
    <div class="modal-box">
      <h3>Konfirmasi Pembayaran QRIS</h3>
      <p class="modal-desc">Scan QRIS untuk menyelesaikan pesanan Anda.</p>
      
      <div class="qris-frame">
        <div class="qr-mockup">
          <svg viewBox="0 0 100 100" class="qr-svg">
            <rect width="100" height="100" fill="#fff" />
            <path d="M10,10 h30 v30 h-30 z M18,18 h14 v14 h-14 z" fill="#000" />
            <path d="M60,10 h30 v30 h-30 z M68,18 h14 v14 h-14 z" fill="#000" />
            <path d="M10,60 h30 v30 h-30 z M18,68 h14 v14 h-14 z" fill="#000" />
            <rect x="45" y="10" width="8" height="40" fill="#000"/>
            <rect x="45" y="60" width="18" height="8" fill="#000"/>
            <rect x="70" y="55" width="20" height="35" fill="#000"/>
            <rect x="50" y="80" width="10" height="10" fill="#000"/>
          </svg>
        </div>
        <span class="qris-nominal" id="modalNominal">Rp 0</span>
      </div>

      <div class="modal-actions">
        <button id="cancelModalBtn" class="btn-secondary">Batal</button>
        <button id="confirmPayBtn" class="btn-primary">Sudah Bayar</button>
      </div>
    </div>
  </dialog>

  <!-- Supabase Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>

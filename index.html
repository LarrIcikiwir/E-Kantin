<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Kantin Sekolah</title>
  
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-12">

  <!-- NAVBAR UTAMA -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center text-lg font-black shadow-md shadow-indigo-500/20">
          K
        </div>
        <div>
          <h1 class="text-base font-extrabold text-slate-900 leading-none">E-Kantin Sekolah</h1>
          <p class="text-[11px] text-slate-500">Menu Makanan & Minuman</p>
        </div>
      </div>

      <!-- KANAN ATAS: Status Role & Tombol Login/Logout -->
      <div class="flex items-center gap-2">
        <span id="role-badge" class="bg-slate-100 text-slate-600 border border-slate-200 text-xs px-3 py-1.5 rounded-xl font-bold">
          Mode Guest
        </span>
        
        <button id="btn-login-trigger" onclick="openLoginModal()" class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-sm">
          <i class="ri-user-settings-line text-sm"></i>
          <span>Login Admin/Kantin</span>
        </button>

        <button id="btn-logout" onclick="logout()" class="hidden bg-rose-50 border border-rose-200 text-rose-600 hover:bg-rose-100 active:scale-95 px-3.5 py-1.5 rounded-xl text-xs font-bold transition items-center gap-1.5">
          <i class="ri-logout-box-r-line text-sm"></i>
          <span>Keluar</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-6 space-y-6">

    <!-- FORM TAMBAH MENU -->
    <div id="add-form-container" class="hidden bg-white p-5 rounded-2xl border border-indigo-100 shadow-md shadow-indigo-500/5">
      <h2 class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-2">
        <i class="ri-add-circle-line text-indigo-600 text-lg"></i>
        <span id="form-title">Tambah Menu Baru</span>
      </h2>

      <form id="add-form" class="grid grid-cols-1 sm:grid-cols-12 gap-3">
        <div class="sm:col-span-3">
          <select id="canteen-select" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
            <option value="1">Kantin 1</option>
            <option value="2">Kantin 2</option>
            <option value="3">Kantin 3</option>
            <option value="4">Kantin 4</option>
            <option value="5">Kantin 5</option>
            <option value="6">Kantin 6</option>
          </select>
        </div>

        <div class="sm:col-span-5">
          <input type="text" id="name" placeholder="Nama Makanan/Minuman" required class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>

        <div class="sm:col-span-4">
          <input type="number" id="price" placeholder="Harga (Rp)" required class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>

        <!-- INPUT FOTO -->
        <div class="sm:col-span-6">
          <label class="block text-[11px] font-medium text-slate-500 mb-1">Upload Foto Makanan</label>
          <input type="file" id="image-file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
        </div>

        <div class="sm:col-span-6">
          <label class="block text-[11px] font-medium text-slate-500 mb-1">Atau Link URL Foto</label>
          <input type="url" id="image-url" placeholder="https://..." class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>

        <div class="sm:col-span-12 flex justify-end">
          <button type="submit" id="btn-save-menu" class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold px-6 py-2.5 rounded-xl text-xs shadow-md shadow-indigo-600/20 transition duration-150">
            Simpan Menu
          </button>
        </div>
      </form>
    </div>

    <!-- TAB FILTER KANTIN (1-6) -->
    <div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar" id="kantin-tabs">
      <button onclick="filterKantin(1)" class="tab-btn bg-white border border-slate-200 px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition whitespace-nowrap shadow-sm">Kantin 1</button>
      <button onclick="filterKantin(2)" class="tab-btn bg-white border border-slate-200 px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition whitespace-nowrap shadow-sm">Kantin 2</button>
      <button onclick="filterKantin(3)" class="tab-btn bg-white border border-slate-200 px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition whitespace-nowrap shadow-sm">Kantin 3</button>
      <button onclick="filterKantin(4)" class="tab-btn bg-white border border-slate-200 px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition whitespace-nowrap shadow-sm">Kantin 4</button>
      <button onclick="filterKantin(5)" class="tab-btn bg-white border border-slate-200 px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition whitespace-nowrap shadow-sm">Kantin 5</button>
      <button onclick="filterKantin(6)" class="tab-btn bg-white border border-slate-200 px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition whitespace-nowrap shadow-sm">Kantin 6</button>
    </div>

    <!-- DAFTAR MENU -->
    <div id="menu-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>

  </main>

  <!-- MODAL LOGIN ADMIN/KANTIN -->
  <div id="login-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl border border-slate-100 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="font-extrabold text-slate-900 text-base">Login Pengelola</h3>
        <button onclick="closeLoginModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="ri-close-line text-xl"></i>
        </button>
      </div>

      <form id="login-form" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Username / Email</label>
          <input type="text" id="login-email" placeholder="admin / kantin1" required class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <button type="submit" id="btn-submit-login" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs shadow-md shadow-indigo-600/20 transition">
          Masuk
        </button>
      </form>
    </div>
  </div>

  <!-- SCRIPT LOGIK JAVASCRIPT -->
  <script>
    // ==========================================
    // KONFIGURASI SUPABASE
    // ==========================================
    const SUPABASE_URL = 'https://ymaqspvidhwgzwrxxbfk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_g5dCXGE7no8ogQQH5wg8cA_4OzjyStl';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let products = [];
    let activeCanteen = 1;
    let currentRole = 'guest';

    function $(id) {
      return document.getElementById(id);
    }

    // ==========================================
    // LOGIN & SESSION MANAGEMENT
    // ==========================================
    async function handleLoginSubmit(e) {
      e.preventDefault();

      const usernameInput = $('login-email').value.trim();
      const passwordInput = $('login-password').value;
      const btn = $('btn-submit-login');

      btn.disabled = true;
      btn.innerText = 'Memproses...';

      const { data, error } = await supabaseClient
        .from('data_user')
        .select('*')
        .eq('username', usernameInput)
        .eq('password', passwordInput)
        .single();

      btn.disabled = false;
      btn.innerText = 'Masuk';

      if (error || !data) {
        alert('Username atau Password salah!');
        return;
      }

      localStorage.setItem('user_session', JSON.stringify({
        username: data.username,
        role: data.role
      }));

      updateRoleUI(data.role);
      closeLoginModal();
    }

    function checkLocalSession() {
      const savedSession = localStorage.getItem('user_session');
      if (savedSession) {
        const user = JSON.parse(savedSession);
        updateRoleUI(user.role);
      } else {
        updateRoleUI('guest');
      }
    }

    function logout() {
      localStorage.removeItem('user_session');
      updateRoleUI('guest');
    }

    // ==========================================
    // UPDATE TAMPILAN TAMPILAN SESUAI ROLE
    // ==========================================
    function updateRoleUI(role) {
      currentRole = role;
      const roleBadge = $('role-badge');
      const btnLogin = $('btn-login-trigger');
      const btnLogout = $('btn-logout');
      const formContainer = $('add-form-container');
      const selectCanteen = $('canteen-select');

      if (role === 'guest') {
        roleBadge.innerText = 'Mode Guest';
        roleBadge.className = 'bg-slate-100 text-slate-600 border border-slate-200 text-xs px-3 py-1.5 rounded-xl font-bold';
        btnLogin.classList.remove('hidden');
        btnLogout.classList.add('hidden');
        formContainer.classList.add('hidden');
      } else {
        btnLogin.classList.add('hidden');
        btnLogout.classList.remove('hidden');
        btnLogout.classList.add('flex');
        formContainer.classList.remove('hidden');

        if (role === 'admin') {
          roleBadge.innerText = 'Role: ADMIN';
          roleBadge.className = 'bg-rose-100 text-rose-700 border border-rose-200 text-xs px-3 py-1.5 rounded-xl font-bold';
          selectCanteen.disabled = false;
        } else if (role.startsWith('kantin')) {
          const num = role.replace('kantin', '');
          roleBadge.innerText = `Role: Kantin ${num}`;
          roleBadge.className = 'bg-emerald-100 text-emerald-700 border border-emerald-200 text-xs px-3 py-1.5 rounded-xl font-bold';
          selectCanteen.value = num;
          selectCanteen.disabled = true;
          activeCanteen = Number(num);
          updateTabStyle();
        }
      }

      renderMenu();
    }

    // Modal Control
    function openLoginModal() {
      $('login-modal').classList.remove('hidden');
    }

    function closeLoginModal() {
      $('login-modal').classList.add('hidden');$('login-form').reset();
    }

    // ==========================================
    // FETCH & CRUD MENU (DENGAN GAMBAR)
    // ==========================================
    async function fetchProducts() {
      const list = $('menu-list');
      list.innerHTML = `<p class="text-slate-400 col-span-full italic text-center py-8">Memuat data menu...</p>`;

      const { data, error } = await supabaseClient
        .from('data_kantin')
        .select('*')
        .order('id', { ascending: true });

      if (error) {
        list.innerHTML = `<p class="text-rose-500 col-span-full text-center py-8">Gagal memuat data menu.</p>`;
        return;
      }

      products = (data || []).map(item => ({
        id: item.id,
        canteenId: Number(item.canteen_id),
        name: item.name,
        price: Number(item.price),
        imageUrl: item.image_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&q=80'
      }));

      renderMenu();
    }

    async function handleAddProduct(e) {
      e.preventDefault();

      const btnSave = $('btn-save-menu');
      btnSave.disabled = true;
      btnSave.innerText = 'Menyimpan...';

      let canteenId = parseInt($('canteen-select').value);
      if (currentRole.startsWith('kantin')) {
        canteenId = parseInt(currentRole.replace('kantin', ''));
      }

      const name = $('name').value.trim();
      const price = parseInt($('price').value);
      const fileInput = $('image-file').files[0];
      const urlInput = $('image-url').value.trim();

      let finalImageUrl = urlInput;

      // 1. Upload File Lokal jika ada file yang dipilih
      if (fileInput) {
        const fileExt = fileInput.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
        const filePath = `menu/${fileName}`;

        const { error: uploadError } = await supabaseClient.storage
          .from('menu-images')
          .upload(filePath, fileInput);

        if (uploadError) {
          alert('Gagal upload gambar: ' + uploadError.message);
          btnSave.disabled = false;
          btnSave.innerText = 'Simpan Menu';
          return;
        }

        // Ambil URL Publik
        const { data: publicUrlData } = supabaseClient.storage
          .from('menu-images')
          .getPublicUrl(filePath);

        finalImageUrl = publicUrlData.publicUrl;
      }

      // 2. Simpan Data ke Supabase Database
      const { error } = await supabaseClient
        .from('data_kantin')
        .insert([{ 
          canteen_id: canteenId, 
          name: name, 
          price: price,
          image_url: finalImageUrl || null
        }]);

      btnSave.disabled = false;
      btnSave.innerText = 'Simpan Menu';

      if (error) {
        alert('Gagal menambah menu: ' + error.message);
        return;
      }

      $('add-form').reset();
      filterKantin(canteenId);
      await fetchProducts();
    }

    async function deleteMenu(id) {
      const product = products.find(p => p.id === id);
      if (!product || !confirm(`Hapus menu "${product.name}"?`)) return;

      const { error } = await supabaseClient.from('data_kantin').delete().eq('id', id);

      if (error) {
        alert('Gagal menghapus: ' + error.message);
        return;
      }

      await fetchProducts();
    }

    function filterKantin(id) {
      activeCanteen = Number(id);
      updateTabStyle();
      renderMenu();
    }

    function updateTabStyle() {
      const tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach((tab, index) => {
        const canteenNum = index + 1;
        if (canteenNum === activeCanteen) {
          tab.className = 'tab-btn bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap shadow-md shadow-indigo-600/20';
        } else {
          tab.className = 'tab-btn bg-white border border-slate-200 px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition whitespace-nowrap shadow-sm';
        }
      });
    }

    function renderMenu() {
      const list = $('menu-list');
      const filtered = products.filter(p => p.canteenId === activeCanteen);

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="col-span-full text-center py-10">
            <i class="ri-restaurant-line text-4xl text-slate-300"></i>
            <p class="text-slate-400 italic mt-2">Belum ada menu di Kantin ${activeCanteen}.</p>
          </div>`;
        return;
      }

      const canDelete = currentRole === 'admin' || currentRole === `kantin${activeCanteen}`;

      list.innerHTML = '';
      filtered.forEach(item => {
        list.innerHTML += `
          <div class="card-item bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden flex flex-col justify-between">
            <div>
              <img src="${item.imageUrl}" alt="${escapeHTML(item.name)}" class="w-full h-36 object-cover bg-slate-100" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&q=80'">
              <div class="p-3.5 space-y-1">
                <h3 class="font-bold text-slate-800 text-sm leading-snug">${escapeHTML(item.name)}</h3>
                <p class="text-xs text-emerald-600 font-extrabold">
                  Rp ${item.price.toLocaleString('id-ID')}
                </p>
              </div>
            </div>
            ${canDelete ? `
              <div class="p-3 pt-0 flex justify-end">
                <button onclick="deleteMenu(${item.id})" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition active:scale-95" title="Hapus Menu">
                  <i class="ri-delete-bin-line text-base"></i>
                </button>
              </div>
            ` : ''}
          </div>
        `;
      });
    }

    function escapeHTML(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ==========================================
    // INISIALISASI
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
      $('login-form').addEventListener('submit', handleLoginSubmit);$('add-form').addEventListener('submit', handleAddProduct);
      updateTabStyle();
      checkLocalSession();
      fetchProducts();
    });
  </script>
</body>
</html>
